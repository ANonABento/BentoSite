<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>B-01 Concept Sheet</title>
<!--
  bentOS service unit B-01: concept sheet v1.
  Original design, drawn entirely in code (no reference images used as input).
  Render: Chrome --headless --screenshot --window-size=2400,1500 sheet.html
-->
<style>
  :root {
    --lacquer: #0e0b0a; --ceramic: #f2ece2; --neon: #e8823f; --gun: #5d5f63;
    --paper: #e4ddd1; --ink: #2a2420;
  }
  html, body { margin: 0; background: var(--paper); }
  body { width: 2400px; height: 1500px; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  svg { display: block; }
  text { font-family: "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<svg id="sheet" width="2400" height="1500" viewBox="0 0 2400 1500" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="parts.js"></script>
<script>
// ======================================================================
// LAYOUT
// ======================================================================
el('rect', { x: 0, y: 0, width: 2400, height: 1500, fill: 'url(#grid)' });

// header
txt(sheet, 48, 66, 'bentOS  SERVICE UNIT  B-01', { 'font-size': 38, 'font-weight': 700, 'letter-spacing': 6, fill: C.ink });
txt(sheet, 50, 98, 'Concept sheet v2: porcelain-doll robot maid for the CRT prologue. Original design, not traced from any reference.', { 'font-size': 18, fill: '#5a5048' });
txt(sheet, 2352, 66, 'K. JIANG / BENTOSITE / 2026-10-15', { 'font-size': 16, 'text-anchor': 'end', class: 'mono', fill: '#5a5048' });
el('line', { x1: 48, y1: 118, x2: 2352, y2: 118, stroke: C.ink, 'stroke-width': 2 });

// panel helper
function panel(x, y, w, h, label, dark = false) {
  el('rect', { x, y, width: w, height: h, fill: dark ? '#070505' : 'none', stroke: dark ? '#000' : '#b9ae9f', 'stroke-width': 1.5, rx: 4 });
  txt(sheet, x + 14, y + 26, label, { 'font-size': 14, 'letter-spacing': 3, fill: dark ? '#8a7d70' : '#7a6e62', class: 'mono' });
}

// turnaround: front + back
panel(48, 140, 1040, 1310, 'A  TURNAROUND  ·  FRONT / BACK  ·  6.7 HEADS');
const SC = 1.8, TY = 232;
figureFront(g(sheet, { transform: `translate(400,${TY}) scale(${SC})` }));
figureBack(g(sheet, { transform: `translate(770,${TY}) scale(${SC})` }));
for (let i = 0; i <= 6; i++) {
  const y = TY + i * 96 * SC;
  el('line', { x1: 575, y1: y, x2: 595, y2: y, stroke: '#9c9083', 'stroke-width': 1 });
  txt(sheet, 601, y + 5, `${i}`, { 'font-size': 13, class: 'mono', fill: '#9c9083' });
}
function callout(x1, y1, x2, y2, label, sub, anchor = 'start') {
  if (anchor === 'end') { x2 = 230; }
  el('circle', { cx: x1, cy: y1, r: 3.5, fill: C.o }, sheet);
  el('polyline', { points: `${x1},${y1} ${x2},${y2} ${x2 + (anchor === 'start' ? 14 : -14)},${y2}`, fill: 'none', stroke: C.ink, 'stroke-width': 1 });
  const tx = anchor === 'end' ? 70 : x2 + 20;
  txt(sheet, tx, y2 + 5, label, { 'font-size': 15, 'font-weight': 700, fill: C.ink });
  if (sub) txt(sheet, tx, y2 + 23, sub, { 'font-size': 13, fill: '#6a5f55' });
}
const fx = (u) => 400 + u * SC, fy = (v) => TY + v * SC;
callout(fx(-18), fy(-12), 0, 190, 'Pleated headdress', 'ceramic frill + bento pin', 'end');
callout(fx(-24), fy(20), 0, 270, 'Hime cut', 'glossy hard-surface locks', 'end');
callout(fx(-14), fy(58), 0, 350, 'Aperture eyes', 'emissive iris, lid plates', 'end');
callout(fx(-22), fy(73), 0, 430, 'Blush LEDs', 'three dashes per cheek', 'end');
callout(fx(-2), fy(122), 0, 510, 'Collar + bow', 'lit gem core', 'end');
callout(fx(-50), fy(128), 0, 590, 'Puff sleeves', 'glossy shells, ceramic trim', 'end');
callout(fx(-57), fy(204), 0, 670, 'Ball joints', 'chrome, glowing seam ring', 'end');
callout(fx(-12), fy(248), 0, 750, 'Apron', 'scalloped ceramic plates', 'end');
callout(fx(-48), fy(282), 0, 830, 'Skirt', 'glossy A-line, petticoat hem', 'end');
callout(fx(-19), fy(330), 0, 930, 'Ceramic thigh', 'zettai ryouiki', 'end');
callout(fx(-19), fy(356), 0, 1010, 'Thigh-highs', 'frill band, neon line', 'end');
callout(fx(-20), fy(448), 0, 1110, 'Knee joint', '', 'end');
callout(fx(-20), fy(610), 0, 1300, 'Mary-Janes', 'strap + lit button', 'end');
const bx = (u) => 770 + u * SC;
callout(bx(8), fy(30), 900, 250, 'Ribbon tails', 'headdress ties', 'start');
callout(bx(40), fy(120), 900, 420, 'Long back hair', 'over-shoulder silhouette', 'start');
callout(bx(24), fy(198), 900, 610, 'Apron bow', 'big ceramic bow', 'start');

function clipRect(x, y, w, h) {
  const id = 'c' + Math.random().toString(36).slice(2);
  const cp = el('clipPath', { id }, defs);
  el('rect', { x, y, width: w, height: h }, cp);
  return `url(#${id})`;
}

// head close-ups
panel(1112, 140, 600, 640, 'B  HEAD  ·  PORCELAIN DOLL FACE');
{
  const clip = g(sheet, { 'clip-path': clipRect(1113, 170, 598, 609) });
  headFront(g(clip, { transform: 'translate(1280,262) scale(3.1)' }));
  headSide(g(clip, { transform: 'translate(1585,262) scale(2.6)' }));
}
txt(sheet, 1128, 760, 'No nose sculpt; eyes are screens with a 6-blade aperture iris.', { 'font-size': 14, fill: '#6a5f55' });

// dark: eyes-only test
panel(1736, 140, 616, 640, 'C  DARK READ  ·  LIT BY HER OWN EYES', true);
{
  const clip = g(sheet, { 'clip-path': clipRect(1737, 170, 614, 609) });
  const d = g(clip, { transform: 'translate(2044,250) scale(3.9)' });
  headFront(g(d, { opacity: .13 }), { lit: false });
  el('ellipse', { cx: 0, cy: 62, rx: 50, ry: 30, fill: 'url(#eyeGlow)', opacity: .22 }, d);
  sym(d, h => {
    eye(h, 'open', true);
    el('circle', { cx: 14, cy: 58.5, r: 4, fill: C.o, filter: 'url(#bigGlow)', opacity: .7 }, h);
    for (let i = 0; i < 3; i++) P(h, `M${18 + i * 3.4} 74.5 L${20 + i * 3.4} 71`, '', { stroke: C.o, 'stroke-width': 1.2, 'stroke-linecap': 'round', filter: 'url(#glow)' });
    el('circle', { cx: 42, cy: 58, r: 3.2, fill: 'none', stroke: C.o, 'stroke-width': 1, filter: 'url(#glow)', opacity: .8 }, h);
  });
  txt(sheet, 1752, 760, 'Reflection shot: two irises, blush dashes, ear rings; the bangs cut the brow line.', { 'font-size': 14, fill: '#8a7d70' });
}

// expressions (eye states the rig drives)
panel(1112, 804, 1240, 260, 'D  EXPRESSIONS  ·  setEyes(glow, open) + presets');
['off', 'boot', 'open', 'focus', 'blink', 'happy'].forEach((expr, i) => {
  const x = 1220 + i * 200;
  const clip = g(sheet, { 'clip-path': clipRect(x - 90, 836, 180, 190) });
  headFront(g(clip, { transform: `translate(${x},818) scale(2.05)` }), { expr, lit: expr !== 'off' });
  txt(sheet, x, 1048, expr.toUpperCase(), { 'font-size': 13, 'text-anchor': 'middle', class: 'mono', 'letter-spacing': 2, fill: '#5a5048' });
});

// hand
panel(1112, 1084, 600, 366, 'E  HAND  ·  DEXTEROUS, CABLE-DRIVEN');
handDetail(g(sheet, { transform: 'translate(1280,1110) scale(1.28)' }));
{
  const notes = [
    ['15 DOF', '4 fingers × 3 + thumb × 3'],
    ['Servo knuckles', 'exposed disks, MCP lit'],
    ['Bowden tendons', 'cables over the dorsal plate'],
    ['Ceramic caps', 'proximal + middle phalanges'],
  ];
  notes.forEach(([a, b], i) => {
    txt(sheet, 1460, 1150 + i * 62, a, { 'font-size': 16, 'font-weight': 700, fill: C.ink });
    txt(sheet, 1460, 1170 + i * 62, b, { 'font-size': 13, fill: '#6a5f55' });
  });
}

// palette + spec
panel(1736, 1084, 616, 366, 'F  MATERIALS  ·  SPEC');
[
  ['#0e0b0a', 'Gloss black', 'hair, dress, stockings, shoes'],
  ['#f2ece2', 'Porcelain', 'face, limbs, apron, frills'],
  ['#e8823f', 'Neon (emissive)', 'irises, blush, rings; own mat'],
  ['#9da1a7', 'Chrome', 'ball joints, neck, ear bolts'],
  ['#5d5f63', 'Gunmetal', 'hands, finger servos'],
].forEach(([c, n, d], i) => {
  const y = 1124 + i * 46;
  el('rect', { x: 1756, y, width: 36, height: 36, rx: 4, fill: c === '#9da1a7' ? 'url(#chrome)' : c, stroke: '#00000033' }, sheet);
  txt(sheet, 1806, y + 16, n, { 'font-size': 15, 'font-weight': 700, fill: C.ink });
  txt(sheet, 1806, y + 33, `${c}  ·  ${d}`, { 'font-size': 12, fill: '#6a5f55', class: 'mono' });
});
[
  'Toon/game finish: glossy, hard spec, panel lines baked.',
  'Hair and frills are rigid sculpted shells (no cloth/hair sim).',
  '~40k tris, 5 materials, GLB ≤ 5 MB.  Rig: head, neck, arms, 15 finger bones.',
].forEach((s, i) => txt(sheet, 1756, 1370 + i * 22, s, { 'font-size': 13, fill: C.ink }));
</script>
</body>
</html>
