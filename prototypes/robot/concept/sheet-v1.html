<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>B-01 Concept Sheet</title>
<!--
  bentOS service unit B-01: concept sheet v1.
  Original design, drawn entirely in code (no reference images used as input).
  Render: Chrome --headless --screenshot --window-size=2400,1500 sheet.html
-->
<style>
  :root {
    --lacquer: #0e0b0a; --ceramic: #f2ece2; --neon: #e8823f; --gun: #5d5f63;
    --paper: #e4ddd1; --ink: #2a2420;
  }
  html, body { margin: 0; background: var(--paper); }
  body { width: 2400px; height: 1500px; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  svg { display: block; }
  text { font-family: "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<svg id="sheet" width="2400" height="1500" viewBox="0 0 2400 1500" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const sheet = document.getElementById('sheet');
const C = { k: '#0e0b0a', w: '#f2ece2', o: '#e8823f', g: '#5d5f63', ink: '#2a2420', line: '#3b3430' };

function el(tag, attrs = {}, parent = sheet) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function g(parent = sheet, attrs = {}) { return el('g', attrs, parent); }
function txt(parent, x, y, s, attrs = {}) { const t = el('text', { x, y, ...attrs }, parent); t.textContent = s; return t; }

// ---------- defs: toon fills + glow ----------
const defs = el('defs');
defs.innerHTML = `
  <linearGradient id="wT" x1="0" x2="1"><stop offset="0" stop-color="#fbf7f0"/><stop offset=".58" stop-color="#f2ece2"/><stop offset=".58" stop-color="#d8cfc1"/><stop offset="1" stop-color="#cbc1b2"/></linearGradient>
  <linearGradient id="kT" x1="0" x2="1"><stop offset="0" stop-color="#2b2522"/><stop offset=".5" stop-color="#16110f"/><stop offset=".5" stop-color="#0e0b0a"/><stop offset="1" stop-color="#070505"/></linearGradient>
  <linearGradient id="gT" x1="0" x2="1"><stop offset="0" stop-color="#8b8e93"/><stop offset=".55" stop-color="#5d5f63"/><stop offset=".55" stop-color="#46484c"/><stop offset="1" stop-color="#3a3b3f"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2422"/><stop offset=".35" stop-color="#0e0b0a"/><stop offset="1" stop-color="#050404"/></linearGradient>
  <radialGradient id="eyeGlow"><stop offset="0" stop-color="#ffd9b0" stop-opacity="1"/><stop offset=".35" stop-color="#e8823f" stop-opacity=".9"/><stop offset="1" stop-color="#e8823f" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="b1"/><feGaussianBlur stdDeviation="7" result="b2" in="SourceGraphic"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bigGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="6" result="b1"/><feGaussianBlur stdDeviation="22" result="b2" in="SourceGraphic"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d6cec1" stroke-width="1"/></pattern>
`;

// Draw a part for the right half (x >= 0) and its mirror.
function sym(parent, fn) { fn(g(parent)); fn(g(parent, { transform: 'scale(-1,1)' })); }
const S = (cls) => ({
  w: { fill: 'url(#wT)', stroke: C.line, 'stroke-width': 1.1, 'stroke-linejoin': 'round' },
  k: { fill: 'url(#kT)', stroke: '#000', 'stroke-width': 1.1, 'stroke-linejoin': 'round' },
  g: { fill: 'url(#gT)', stroke: '#1d1d1f', 'stroke-width': 1, 'stroke-linejoin': 'round' },
  glass: { fill: 'url(#glass)', stroke: '#000', 'stroke-width': 1.1 },
  pl: { fill: 'none', stroke: '#6f655c', 'stroke-width': .7 },       // panel line on ceramic
  plk: { fill: 'none', stroke: '#3c3532', 'stroke-width': .7 },      // panel line on lacquer
  neon: { fill: 'none', stroke: C.o, 'stroke-width': 1.6, filter: 'url(#glow)', 'stroke-linecap': 'round' },
  neonF: { fill: C.o, filter: 'url(#glow)' },
}[cls]);
const P = (parent, d, cls, extra = {}) => el('path', { d, ...S(cls), ...extra }, parent);

// ======================================================================
// HEAD (front). Local units: crown y=0, chin y=94, centre x=0.
// ======================================================================
function headFront(p, { lit = true } = {}) {
  // tie-plate ribbons behind the head (visible past the bob)
  sym(p, h => P(h, 'M34 30 L50 70 L46 98 L40 98 L42 72 L30 38 Z', 'k'));
  // radiator crest (the maid frill as heatsink fins)
  sym(p, h => {
    for (let i = 0; i < 4; i++) {
      const a = -90 + i * 17, r0 = 34, r1 = 50 - i * 1.5;
      const rad = a * Math.PI / 180, x0 = Math.cos(rad) * r0, y0 = 30 + Math.sin(rad) * r0;
      const x1 = Math.cos(rad) * r1, y1 = 30 + Math.sin(rad) * r1;
      const n = 4.2, nx = -Math.sin(rad) * n, ny = Math.cos(rad) * n;
      P(h, `M${x0 - nx} ${y0 - ny} L${x1 - nx * .8} ${y1 - ny * .8} Q${x1} ${y1 - 1.5} ${x1 + nx * .8} ${y1 + ny * .8} L${x0 + nx} ${y0 + ny} Z`, 'w');
    }
  });
  // crest band
  sym(p, h => P(h, 'M0 -3 Q22 -3 36 10 L32 16 Q20 4 0 4 Z', 'g'));
  // bob-cut armour plates (lacquer), outer silhouette
  sym(p, h => P(h, 'M0 4 Q30 4 40 26 Q46 46 44 74 L40 82 L30 78 L28 40 Q20 22 0 20 Z', 'k'));
  // ceramic skull shell (visible as cheek/jaw guards)
  sym(p, h => P(h, 'M0 20 Q24 22 29 40 L31 70 Q28 84 14 92 Q6 95 0 95 Z', 'w'));
  // face shield (black glass)
  sym(p, h => P(h, 'M0 31 L24 33 Q27 36 26 46 L23 66 Q18 80 0 87 Z', 'glass'));
  // blunt "bangs" brow plate
  sym(p, h => P(h, 'M0 18 Q26 18 33 30 L31 37 L22 35 L20 38 L11 35 L9 38 L0 36 Z', 'k'));
  sym(p, h => P(h, 'M10 21 L10 34 M21 22 L21 34', 'plk'));
  // ear module: actuator housing with ring light
  sym(p, h => {
    el('circle', { cx: 42, cy: 55, r: 9.5, ...S('g') }, h);
    el('circle', { cx: 42, cy: 55, r: 5.5, fill: '#1a1a1c', stroke: '#000' }, h);
    if (lit) el('circle', { cx: 42, cy: 55, r: 5.5, fill: 'none', stroke: C.o, 'stroke-width': 1.3, filter: 'url(#glow)' }, h);
    P(h, 'M44 64 Q46 78 38 86', 'g', { fill: 'none', 'stroke-width': 2.4, stroke: '#2b2b2e' });
  });
  // cheek panel lines + jaw seam
  sym(p, h => P(h, 'M28 52 L22 70 M0 90 Q10 88 17 82', 'pl'));
  // eyes: canted slit lamps behind shutter blades
  sym(p, h => {
    if (lit) {
      el('ellipse', { cx: 15, cy: 49, rx: 15, ry: 7, fill: 'url(#eyeGlow)', opacity: .65 }, h);
      P(h, 'M5.5 51.5 L22.5 46 Q24.2 46.4 23.6 48.2 L7 53.6 Q5 53.6 5.5 51.5 Z', 'neonF');
      P(h, 'M8 51.6 L20.5 47.6', '', { stroke: '#fff3e0', 'stroke-width': 1, fill: 'none' });
    } else {
      P(h, 'M5.5 51.5 L22.5 46 Q24.2 46.4 23.6 48.2 L7 53.6 Q5 53.6 5.5 51.5 Z', '', { fill: '#2a1a12' });
    }
    // upper shutter blade
    P(h, 'M4 49 L23 43.2 L24.5 44.6 L5 50.6 Z', 'g', { 'stroke-width': .6 });
  });
  // mouth grille: three short vents
  for (let i = 0; i < 3; i++) P(p, `M-5 ${72 + i * 3} L5 ${72 + i * 3}`, '', { stroke: '#2e2826', 'stroke-width': 1.2 });
}

// ======================================================================
// HEAD (profile, facing +x).
// ======================================================================
function headSide(p) {
  // ribbon tie plates trailing back
  P(p, 'M-30 28 L-62 54 L-58 60 L-26 36 Z', 'k');
  P(p, 'M-30 30 L-54 74 L-48 76 L-25 38 Z', 'k');
  // crest fins (seen edge-on, fanned)
  for (let i = 0; i < 6; i++) {
    const x = -22 + i * 9, h = 13 - Math.abs(i - 2.5) * 2;
    P(p, `M${x} ${4 - (2.5 - Math.abs(i - 2.5)) * 1.2} l2 ${-h} l5 0 l1 ${h} Z`, 'w');
  }
  P(p, 'M-28 8 Q2 -6 30 8 L28 14 Q2 1 -26 14 Z', 'g');
  // skull shell
  P(p, 'M-36 30 Q-34 6 0 6 Q30 6 36 30 L38 50 Q36 74 26 86 Q18 94 6 95 L-6 90 L-10 70 Z', 'w');
  // bob plates (lacquer) wrapping back + side
  P(p, 'M-40 26 Q-36 2 0 4 Q24 5 32 20 L20 24 Q4 18 -12 24 L-10 50 L4 76 L-6 84 L-34 80 Q-44 54 -40 26 Z', 'k');
  P(p, 'M-24 18 L-28 72 M-12 26 L-14 70', 'plk');
  // nape port: cable bundle into neck
  P(p, 'M-26 80 Q-30 96 -20 110', '', { fill: 'none', stroke: '#2b2b2e', 'stroke-width': 3 });
  P(p, 'M-20 82 Q-22 96 -14 110', '', { fill: 'none', stroke: '#3a3b3f', 'stroke-width': 2.2 });
  // face shield in profile
  P(p, 'M30 28 Q40 32 40 46 L36 70 Q30 84 18 90 L22 64 L24 36 Z', 'glass');
  // brow plate overhang
  P(p, 'M10 18 Q32 18 38 30 L36 36 L28 34 L22 26 Z', 'k');
  // eye slit seen from side
  el('ellipse', { cx: 37, cy: 48, rx: 4, ry: 8, fill: 'url(#eyeGlow)', opacity: .7 }, p);
  P(p, 'M35.5 45 L39 44 L38.6 50.5 L35.2 51 Z', 'neonF');
  // ear module
  el('circle', { cx: 2, cy: 54, r: 11, ...S('g') }, p);
  el('circle', { cx: 2, cy: 54, r: 6.5, fill: '#1a1a1c', stroke: '#000' }, p);
  el('circle', { cx: 2, cy: 54, r: 6.5, fill: 'none', stroke: C.o, 'stroke-width': 1.4, filter: 'url(#glow)' }, p);
  el('circle', { cx: 2, cy: 54, r: 2, fill: '#5d5f63' }, p);
  P(p, 'M20 60 L28 76 M14 88 L24 82', 'pl');
}

// ======================================================================
// BODY (front). Head occupies y 0..95 (one head = 95 units), ~7.2 heads tall.
// ======================================================================
function figureFront(p) {
  // ---- legs ----
  sym(p, h => {
    P(h, 'M9 336 L33 336 L30 455 L13 455 Z', 'k');                       // thigh armour (lacquer stocking)
    P(h, 'M9 336 L33 336 L33 348 L9 348 Z', 'w');                         // stocking band
    P(h, 'M12 352 L30 352', 'neon');
    el('circle', { cx: 21.5, cy: 466, r: 10, ...S('g') }, h);             // knee actuator
    el('circle', { cx: 21.5, cy: 466, r: 3.5, fill: '#222' }, h);
    P(h, 'M12 462 Q21 450 31 462 L30 474 L13 474 Z', 'w');                // knee cap
    P(h, 'M12 478 L31 478 L28 606 L15 606 Z', 'w');                       // greave
    P(h, 'M22 486 L22 596', 'pl');
    P(h, 'M27 490 L25.5 590', 'neon');
    P(h, 'M14 604 L30 604 L33 650 L36 684 L26 690 L12 690 L10 650 Z', 'k');  // boot
    P(h, 'M12 676 L12 692 L18 692 L18 678 Z', 'g');                       // heel
    P(h, 'M14 620 L31 620', 'plk');
  });
  // ---- skirt: lamellar plates ----
  sym(p, h => {
    P(h, 'M0 232 L36 232 L74 330 Q40 342 0 342 Z', 'k');
    for (const [a, b] of [[12, 22], [24, 44], [33, 62]]) P(h, `M${a} 236 L${b} 338`, 'plk');
    // ceramic petticoat scallops
    for (let i = 0; i < 5; i++) {
      const x0 = i * 15, x1 = x0 + 15, y0 = 336 + i * .6;
      P(h, `M${x0} ${y0 + 2} Q${(x0 + x1) / 2} ${y0 + 15} ${x1} ${y0} L${x1} ${y0 - 4} L${x0} ${y0 - 2} Z`, 'w');
    }
  });
  // ---- apron: hinged ceramic tassets ----
  sym(p, h => {
    P(h, 'M0 236 L24 236 L26 270 L0 270 Z', 'w');
    P(h, 'M0 272 L26.5 272 L28.5 304 L0 306 Z', 'w');
    P(h, 'M0 308 L28.5 306 Q28 324 14 328 L0 330 Z', 'w');
    el('circle', { cx: 21, cy: 241, r: 1.2, fill: '#6f655c' }, h);
    el('circle', { cx: 21, cy: 265, r: 1.2, fill: '#6f655c' }, h);
  });
  // apron emblem: bento grid, one cell lit
  const em = g(p);
  P(em, 'M-8 248 H8 V262 H-8 Z', '', { fill: 'none', stroke: C.line, 'stroke-width': 1 });
  P(em, 'M0 248 V262 M-8 255 H8', '', { fill: 'none', stroke: C.line, 'stroke-width': 1 });
  P(em, 'M1 249 H7 V254 H1 Z', 'neonF');
  // ---- waist: exposed spine actuator + belt ----
  P(p, 'M-13 206 H13 V232 H-13 Z', 'g');
  for (let i = 0; i < 4; i++) P(p, `M-13 ${210 + i * 6} H13`, '', { stroke: '#1d1d1f', 'stroke-width': 1 });
  sym(p, h => {
    P(h, 'M13 208 L30 204 L35 222 L14 226 Z', 'g');                       // oblique pistons
    P(h, 'M16 214 L32 211', '', { stroke: '#9a9da2', 'stroke-width': 1.6 });
    P(h, 'M0 226 L36 222 L37 234 L0 236 Z', 'w');                         // belt
    P(h, 'M3 230 L34 228', 'neon');
  });
  // ---- arms (hanging, slight A) ----
  sym(p, h => {
    P(h, 'M52 140 L64 140 L70 214 L58 216 Z', 'k');                      // upper arm
    P(h, 'M58 150 L62 208', 'plk');
    el('circle', { cx: 64.5, cy: 222, r: 8.5, ...S('g') }, h);             // elbow hinge
    el('circle', { cx: 64.5, cy: 222, r: 2.2, fill: C.o, filter: 'url(#glow)' }, h);
    P(h, 'M57 230 L73 228 L80 294 L62 298 Z', 'w');                       // forearm cuff
    P(h, 'M59 285 L80 282 L82 296 L61 300 Z', 'w');                       // cuff flare
    P(h, 'M62 290 L80 287', 'neon');
    P(h, 'M70 236 L74 280', 'pl');
    P(h, 'M64 300 L78 298 L80 306 L66 308 Z', 'g');                       // wrist
    // hand (relaxed, fingers down)
    P(h, 'M63 308 L81 305 L85 330 L68 334 Z', 'g');
    for (let i = 0; i < 4; i++) {
      const x = 68 + i * 4.4;
      P(h, `M${x} 333 L${x + 1.4} 352 L${x + 4.2} 352 L${x + 3.4} 332`, 'g', { 'stroke-width': .7 });
      el('circle', { cx: x + 1.7, cy: 334, r: 1.6, fill: '#2b2b2e' }, h);
    }
    P(h, 'M63 314 L58 330 L61 334 L66 320', 'g', { 'stroke-width': .7 });  // thumb
  });
  // ---- torso ----
  sym(p, h => P(h, 'M0 118 L36 116 L48 128 L46 166 L36 186 L32 206 L0 206 Z', 'k'));
  sym(p, h => P(h, 'M14 170 L30 166 M8 188 L30 186', 'plk'));
  // apron bib + straps
  sym(p, h => {
    P(h, 'M0 142 L18 142 L17 206 L0 206 Z', 'w');
    P(h, 'M14 142 L18 142 L38 120 L33 118 Z', 'w');
    P(h, 'M0 152 L14 152 M0 196 L15 196', 'pl');
  });
  // ---- pauldrons: puff sleeves as ribbed shells with ceramic fan trim ----
  sym(p, h => {
    P(h, 'M44 122 Q64 114 72 134 Q74 150 62 156 L48 154 Q40 140 44 122 Z', 'k');
    P(h, 'M50 120 Q56 136 54 154 M60 120 Q66 136 64 154', 'plk');
    for (let i = 0; i < 4; i++) {
      const x0 = 46 + i * 7;
      P(h, `M${x0} ${153 + i} Q${x0 + 3.5} ${163 + i} ${x0 + 7} ${154 + i} Z`, 'w');
    }
    P(h, 'M47 126 Q60 118 69 130', 'neon');
  });
  // ---- neck + gorget collar ----
  P(p, 'M-9 92 H9 V118 H-9 Z', 'g');
  for (let i = 0; i < 5; i++) P(p, `M-9 ${96 + i * 4.5} H9`, '', { stroke: '#1d1d1f', 'stroke-width': .9 });
  sym(p, h => {
    P(h, 'M3 106 L20 104 L34 118 L30 126 L4 122 Z', 'w');                // collar wing
    P(h, 'M6 121 L30 124', 'neon');
    P(h, 'M10 108 L26 117', 'pl');
  });
  // brooch: intake fan with lit core
  el('circle', { cx: 0, cy: 128, r: 6, ...S('g') }, p);
  el('circle', { cx: 0, cy: 128, r: 2.6, fill: C.o, filter: 'url(#glow)' }, p);
  // ---- head ----
  headFront(g(p, { transform: 'translate(0,0)' }));
}

// ======================================================================
// BODY (back). Mostly silhouette + the over-the-shoulder read.
// ======================================================================
function figureBack(p) {
  sym(p, h => {
    P(h, 'M9 336 L33 336 L30 455 L13 455 Z', 'k');
    P(h, 'M9 336 L33 336 L33 348 L9 348 Z', 'w');
    el('circle', { cx: 21.5, cy: 466, r: 10, ...S('g') }, h);
    P(h, 'M12 470 L31 470 L28 606 L15 606 Z', 'k');                        // calf: lacquer
    P(h, 'M14 476 L14 600', 'neon');
    P(h, 'M14 604 L30 604 L33 650 L36 684 L26 690 L12 690 L10 650 Z', 'k');
    P(h, 'M12 676 L12 692 L18 692 L18 678 Z', 'g');
    P(h, 'M0 232 L36 232 L74 330 Q40 342 0 342 Z', 'k');
    for (const [a, b] of [[0, 0], [12, 22], [24, 44], [33, 62]]) P(h, `M${a} 236 L${b} 338`, 'plk');
    for (let i = 0; i < 5; i++) {
      const x0 = i * 15, x1 = x0 + 15, y0 = 336 + i * .6;
      P(h, `M${x0} ${y0 + 2} Q${(x0 + x1) / 2} ${y0 + 15} ${x1} ${y0} L${x1} ${y0 - 4} L${x0} ${y0 - 2} Z`, 'w');
    }
    // arms
    P(h, 'M52 140 L64 140 L70 214 L58 216 Z', 'k');
    el('circle', { cx: 64.5, cy: 222, r: 8.5, ...S('g') }, h);
    P(h, 'M57 230 L73 228 L80 294 L62 298 Z', 'w');
    P(h, 'M59 285 L80 282 L82 296 L61 300 Z', 'w');
    P(h, 'M64 300 L78 298 L80 306 L66 308 Z', 'g');
    P(h, 'M63 308 L81 305 L85 330 L68 334 Z', 'g');
    for (let i = 0; i < 4; i++) { const x = 68 + i * 4.4; P(h, `M${x} 333 L${x + 1.4} 352 L${x + 4.2} 352 L${x + 3.4} 332`, 'g', { 'stroke-width': .7 }); }
    // back: lacquer shell with shoulder-blade vents
    P(h, 'M0 116 L36 116 L48 128 L46 166 L36 186 L32 206 L0 206 Z', 'k');
    for (let i = 0; i < 4; i++) P(h, `M${14 + i * 1} ${140 + i * 7} L${32 - i * 1} ${138 + i * 7}`, '', { stroke: C.o, 'stroke-width': 1.3, filter: 'url(#glow)' });
    P(h, 'M44 122 Q64 114 72 134 Q74 150 62 156 L48 154 Q40 140 44 122 Z', 'k');
    P(h, 'M50 120 Q56 136 54 154 M60 120 Q66 136 64 154', 'plk');
    // apron ties: ceramic bow as two radiator wings
    P(h, 'M4 220 Q24 200 40 214 Q36 226 22 228 Q14 226 4 226 Z', 'w');
    P(h, 'M12 214 L14 226 M20 210 L22 227 M28 208 L30 226', 'pl');
    P(h, 'M4 228 L14 266 L22 264 L8 228 Z', 'w');                        // tails
    P(h, 'M0 226 L36 222 L37 234 L0 236 Z', 'w');
  });
  // spine: exposed actuator column
  P(p, 'M-6 118 H6 V232 H-6 Z', 'g');
  for (let i = 0; i < 12; i++) P(p, `M-6 ${121 + i * 9} H6`, '', { stroke: '#1d1d1f', 'stroke-width': 1 });
  P(p, 'M0 122 V228', '', { stroke: C.o, 'stroke-width': 1.2, filter: 'url(#glow)' });
  el('circle', { cx: 0, cy: 222, r: 6, ...S('g') }, p);   // bow knot hub
  el('circle', { cx: 0, cy: 222, r: 2.4, fill: C.o, filter: 'url(#glow)' }, p);
  // neck
  P(p, 'M-9 92 H9 V118 H-9 Z', 'g');
  sym(p, h => P(h, 'M3 104 L22 102 L36 118 L4 120 Z', 'w'));
  // back of head
  const hd = g(p);
  sym(hd, h => {
    for (let i = 0; i < 4; i++) {
      const a = -90 + i * 17, r0 = 34, r1 = 50 - i * 1.5, rad = a * Math.PI / 180;
      const x0 = Math.cos(rad) * r0, y0 = 30 + Math.sin(rad) * r0, x1 = Math.cos(rad) * r1, y1 = 30 + Math.sin(rad) * r1;
      const n = 4.2, nx = -Math.sin(rad) * n, ny = Math.cos(rad) * n;
      P(h, `M${x0 - nx} ${y0 - ny} L${x1 - nx * .8} ${y1 - ny * .8} Q${x1} ${y1 - 1.5} ${x1 + nx * .8} ${y1 + ny * .8} L${x0 + nx} ${y0 + ny} Z`, 'w');
    }
    P(h, 'M0 -3 Q22 -3 36 10 L32 16 Q20 4 0 4 Z', 'g');
    P(h, 'M0 4 Q30 4 40 26 Q46 46 44 74 L40 82 L0 86 Z', 'k');            // full bob from behind
    P(h, 'M12 8 L14 84 M26 14 L28 82', 'plk');
    el('circle', { cx: 42, cy: 55, r: 9.5, ...S('g') }, h);
    P(h, 'M6 30 L30 66 L26 120 L18 120 L22 70 L2 38 Z', 'k');              // tie-plate ribbons hanging
    P(h, 'M10 40 L24 64', 'plk');
  });
  P(hd, 'M-8 82 Q0 90 8 82 L6 96 L-6 96 Z', 'g');                         // nape port
}

// ======================================================================
// HAND detail (back of right hand, fingers up). Local units ~ 1 = 1mm-ish.
// ======================================================================
function handDetail(p) {
  // forearm + wrist
  P(p, 'M-40 250 L40 250 L36 180 L-36 180 Z', 'w');
  P(p, 'M-36 196 L36 196', 'neon');
  P(p, 'M-30 186 L-30 246 M30 186 L30 246', 'pl');
  P(p, 'M-30 180 L30 180 L28 160 L-28 160 Z', 'g');
  el('ellipse', { cx: 0, cy: 162, rx: 26, ry: 7, ...S('g') }, p);              // wrist bearing
  // palm/back plate
  P(p, 'M-34 150 L34 150 L40 76 L-40 76 Z', 'g');
  P(p, 'M-24 142 L24 142 L28 86 L-28 86 Z', 'w');                               // dorsal ceramic plate
  P(p, 'M-18 100 L18 100', 'pl');
  // fingers: index..pinky, 3 phalanges each with servo knuckles
  const fingers = [
    { x: -27, len: [26, 18, 14], ang: -6 },
    { x: -9, len: [30, 20, 15], ang: -2 },
    { x: 9, len: [28, 19, 14], ang: 2 },
    { x: 26, len: [22, 15, 12], ang: 7 },
  ];
  for (const f of fingers) {
    const fg = g(p, { transform: `translate(${f.x},76) rotate(${f.ang})` });
    let y = 0;
    // tendon cable runs from the wrist up the back of the hand
    P(p, `M${f.x * .55} 160 Q${f.x * .8} 120 ${f.x} 80`, '', { fill: 'none', stroke: '#1d1d1f', 'stroke-width': 2.2 });
    P(p, `M${f.x * .55} 160 Q${f.x * .8} 120 ${f.x} 80`, '', { fill: 'none', stroke: '#b5b8bd', 'stroke-width': .8 });
    f.len.forEach((L, i) => {
      const w = 7.5 - i * .8;
      el('circle', { cx: 0, cy: y, r: w + 1, ...S('g') }, fg);                  // servo knuckle
      el('circle', { cx: 0, cy: y, r: 2, fill: i === 0 ? C.o : '#222', ...(i === 0 ? { filter: 'url(#glow)' } : {}) }, fg);
      P(fg, `M${-w} ${y - 3} L${-w + 1} ${y - L + 3} L${w - 1} ${y - L + 3} L${w} ${y - 3} Z`, i === 2 ? 'k' : 'g');
      if (i < 2) P(fg, `M${-w + 2} ${y - 5} L${-w + 2.6} ${y - L + 6} L${w - 2.6} ${y - L + 6} L${w - 2} ${y - 5} Z`, 'w');  // phalanx cap
      y -= L;
    });
    P(fg, `M${-5} ${y + 3} Q0 ${y - 4} 5 ${y + 3}`, 'k');                     // fingertip pad
  }
  // thumb on its own 2-axis base
  const th = g(p, { transform: 'translate(-40,128) rotate(-48)' });
  el('circle', { cx: 0, cy: 0, r: 10, ...S('g') }, th);
  el('circle', { cx: 0, cy: 0, r: 3, fill: C.o, filter: 'url(#glow)' }, th);
  let ty = 0;
  [24, 18, 14].forEach((L, i) => {
    const w = 8 - i;
    if (i) el('circle', { cx: 0, cy: ty, r: w + 1, ...S('g') }, th);
    P(th, `M${-w} ${ty - 3} L${-w + 1} ${ty - L + 3} L${w - 1} ${ty - L + 3} L${w} ${ty - 3} Z`, i === 2 ? 'k' : 'g');
    if (i < 2) P(th, `M${-w + 2} ${ty - 5} L${-w + 2.6} ${ty - L + 6} L${w - 2.6} ${ty - L + 6} L${w - 2} ${ty - 5} Z`, 'w');
    ty -= L;
  });
}
