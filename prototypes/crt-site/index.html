<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bentOS Prologue</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Orbitron:wght@700&family=VT323&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0807; overflow: hidden; }
  canvas.stage { display: block; width: 100%; height: 100%; }
  #stage { position: fixed; inset: 0; }
  /* the scene, then the control bar, then the studio's timeline across the bottom (38vh) */
  body.studio #stage { bottom: calc(38vh + 34px); }
  body.studio #hint { display: none; }
  body.studio .prologue-sound { left: auto; right: 14px; }   /* clear of the studio's object list */
  #bar { position: fixed; left: 0; right: 0; bottom: 38vh; height: 34px; z-index: 6; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; box-sizing: border-box; background: #14100e; border-top: 1px solid #2a2421;
    font: 16px/1 VT323, monospace; letter-spacing: 0.05em; color: #f2ece2; }
  #bar button, #bar select { font: inherit; color: #f2ece2; background: #221c19; border: 1px solid #3a312c; border-radius: 4px;
    height: 24px; padding: 0 9px; cursor: pointer; }
  #bar button:hover, #bar select:hover { border-color: #e8823f; }
  #bar .play { width: 64px; color: #0a0807; background: #e8823f; border-color: #e8823f; }
  #bar .time { color: #e8823f; min-width: 64px; }
  #bar .beat { min-width: 180px; }   /* the beat: a steady width, so the controls don't shift */
  #bar i { color: #a39a90; font-style: normal; }
  #bar .grow { flex: 1; }
  #hint { position: fixed; left: 16px; bottom: 14px; font: 13px/1.4 'VT323', monospace; color: #a39a90; letter-spacing: 0.04em; pointer-events: none; }
  .prologue-flash { position: fixed; inset: 0; background: #fff; mix-blend-mode: difference; opacity: 0; pointer-events: none; z-index: 5; }
  .lil-gui.root { position: fixed; top: 8px !important; right: auto !important; left: 50%; transform: translateX(-50%); }   /* the studio takes the sides and the bottom */
  .prologue-sound { position: absolute; left: 14px; bottom: 14px; z-index: 6; font: 15px VT323, monospace; letter-spacing: 0.06em; color: #e8823f;
    background: rgba(10, 8, 7, 0.6); border: 1px solid rgba(232, 130, 63, 0.4); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "@theatre/core": "https://esm.sh/@theatre/core@0.7.2",
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hint">SPACE play/pause · ← → step · drag the timeline (studio, bottom)</div>
<script type="module">
// The prologue engine lives in the site (src/components/Prologue/engine); this page runs it with the Theatre.js studio
// (keyframes, curves, settings; its playhead drives the scene) and the old lil-gui panel. SAVE writes the studio's
// project to src/components/Prologue/theatre-state.json through serve.py; the site plays that file.
//   ?t=5.2 opens paused there · ?probe writes bone positions into the page · ?robot=<file>.glb loads assets/<file>
//   ?handoff stops where the site takes over instead of playing the in-TV board · ?nostudio: no studio, wall clock
import { startPrologue } from '../../src/components/Prologue/engine/prologue.js';
import { PROJECT_ID } from '../../src/components/Prologue/engine/timeline.js';
const q = new URLSearchParams(location.search);
const robot = q.get('robot');
const withStudio = !q.has('nostudio');
// the saved file is the only state (no browser copy to conflict with it); leaving with unsaved edits asks first
// (imported only when used: an imported studio that's never initialised keeps the project from ever loading)
const studio = withStudio ? (await import('https://esm.sh/@theatre/studio@0.7.2?deps=@theatre/core@0.7.2')).default : null;
if (withStudio) { studio.initialize({ usePersistentStorage: false }); document.body.classList.add('studio'); }
const theatreState = await fetch('/src/components/Prologue/theatre-state.json').then((r) => r.json());
let controls = null, restartTimer = 0;
const start = async (startAt) => {
  controls?.dispose();
  controls = await startPrologue({
    container: document.getElementById('stage'),
    robotUrl: robot?.endsWith('.glb') ? `./assets/${robot}` : '/public/prologue/robot-maid.glb',
    boardUrl: '../crt-boot/board.json',
    assetBase: '/public',
    theatreState,
    studio: withStudio,
    gui: true,
    debug: true,
    probe: q.has('probe'),
    startAt,
    onHandoff: q.has('handoff') ? () => console.log('handoff') : undefined,
    // the click time or the glass shot changed: rebuild the scene where the playhead is
    onRestartNeeded: () => { clearTimeout(restartTimer); restartTimer = setTimeout(() => start(window.prologueNow()), 400); },
  });
};
await start(q.has('t') ? parseFloat(q.get('t')) : null);

if (withStudio) {
  // open with the Camera selected: its values on the right, its keyframes (the whole shot) on the timeline
  studio.setSelection([controls.timeline.objects.Camera]);
  // the timeline across the full width of the bottom (Theatre has no public API for panel placement)
  try {
    window.__TheatreJS_StudioBundle._studio.transaction(({ stateEditors }) => stateEditors.studio.historic.panelPositions.setPanelPosition({
      panelId: 'sequenceEditor',
      position: { edges: { left: { from: 'screenLeft', distance: 0 }, right: { from: 'screenRight', distance: 0 },
        top: { from: 'screenBottom', distance: 0.38 }, bottom: { from: 'screenBottom', distance: 0 } } },
    }));
  } catch (e) { console.warn('timeline placement', e); }

  // the control bar between the scene and the timeline: restart, play, jump to a beat, where the playhead is, SAVE
  const T = window.prologueTimes;
  const bar = Object.assign(document.createElement('div'), { id: 'bar' });
  const button = (text, title, onclick, cls = '') => Object.assign(document.createElement('button'), { textContent: text, title, onclick, className: cls });
  const seek = (pos) => { window.prologueSeek(pos); };
  const rewind = button('⏮', 'Back to the start', () => seek(0));
  const play = button('▶ PLAY', 'Play / pause (Space)', () => { window.prologuePlay(); play.blur(); }, 'play');
  const beats = document.createElement('select');
  beats.title = 'Jump the playhead to a story beat';
  beats.append(new Option('jump to beat…', ''), ...T.BEATS.map(([t, name]) => new Option(`${t.toFixed(2)}  ${name}`, String(t))));
  beats.onchange = () => { if (beats.value) seek(T.positionAt(+beats.value)); beats.value = ''; beats.blur(); };
  const time = Object.assign(document.createElement('span'), { className: 'time' });
  const beat = Object.assign(document.createElement('span'), { className: 'beat' });
  const keys = Object.assign(document.createElement('i'), { textContent: 'SPACE play · ← → 0.1 s' });
  const grow = Object.assign(document.createElement('span'), { className: 'grow' });
  const save = button('SAVE', 'Write the keyframes and settings to src/components/Prologue/theatre-state.json', null, 'play');
  bar.append(grow.cloneNode(), rewind, play, beats, time, beat, grow, keys, save);   // centred: the studio's object list hangs over the left
  document.body.append(bar);
  let last = '';
  (function tick() {
    const pos = window.prologueNow(), scene = window.prologueScene();
    const name = T.BEATS.filter(([t]) => t <= scene.story + 1e-3).at(-1)?.[1] ?? '';
    const held = pos - scene.time > 0.005;   // Retime holds put the scene behind the playhead
    const playing = window.prologuePlaying();
    const text = `${pos.toFixed(2)}|${held ? scene.time.toFixed(2) : ''}|${name}|${playing}`;
    if (text !== last) {
      last = text;
      time.textContent = `${pos.toFixed(2)} s`;
      beat.innerHTML = `${name}${held ? ` <i>(scene ${scene.time.toFixed(2)} s)</i>` : ''}`;
      play.textContent = playing ? '❚❚ PAUSE' : '▶ PLAY';
    }
    requestAnimationFrame(tick);
  })();

  const snapshot = () => JSON.stringify(studio.createContentOfSaveFile(PROJECT_ID).sheetsById);
  let saved = snapshot();
  addEventListener('beforeunload', (e) => { if (snapshot() !== saved) e.preventDefault(); });
  save.onclick = async () => {
    const r = await fetch('/__save-theatre', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(studio.createContentOfSaveFile(PROJECT_ID)) });
    if (r.ok) saved = snapshot();
    save.textContent = r.ok ? 'SAVED ✓' : `SAVE FAILED (${r.status})`;
    setTimeout(() => { save.textContent = 'SAVE'; }, 1800);
  };
}
</script>
</body>
</html>
