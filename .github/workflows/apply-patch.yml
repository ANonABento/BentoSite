name: apply-patch

# Waymond commits small .patches/*.patch files; this applies them, runs the checks,
# and pushes a normal fast-forward commit (no force-push). On failure nothing lands.
on:
  push:
    branches: [waymond/intro-anim]
    paths: ['.patches/*.patch', '.github/workflows/apply-patch.yml']

permissions:
  contents: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: waymond/intro-anim
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patches
        run: |
          shopt -s nullglob
          for p in .patches/*.patch; do
            echo "applying $p"
            git apply --check "$p"
            git apply "$p"
            git rm -q "$p"
            echo "$(basename "$p" .patch)" >> /tmp/applied
          done
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - name: Commit and push
        run: |
          if [ ! -s /tmp/applied ]; then echo "no patches to apply"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "apply: $(paste -sd, /tmp/applied)"
          git push origin HEAD:waymond/intro-anim
